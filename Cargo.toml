[package]
name = "family-chat-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tl = "0.7"
futures-util = "0.3"
toml = "0.8"
url = "2"
# Self-update (#64): a separate, synchronous HTTP client deliberately kept
# out of the async reqwest/tokio stack, since upgrade/uninstall run as a
# one-shot CLI subcommand before the TUI (or its runtime) ever starts — see
# src/selfupdate/mod.rs.
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
sha2 = "0.11"
semver = "1"
dirs = "7"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
# Single-crate binary distributed to a handful of people, not a library —
# maximum optimization at the cost of a slower release build is the right
# tradeoff, and there's no reason to keep debug symbols in the shipped
# binary. Deliberately not `panic = "abort"`: background tokio tasks (a
# message load, the SSE stream) already isolate a panic to just that task,
# and aborting the whole process on any of them would trade a recoverable
# failure for an unrecoverable one.
lto = true
codegen-units = 1
strip = true
